[workspace]
members = [".", "crates/kite-ctx"]

[package]
name = "kite-code"
version = "0.1.96"
description = "Kite Code Desktop Application"
authors = ["Kite Code Authors"]
edition = "2021"
default-run = "kite-code"

[[bin]]
name = "kite-code"
path = "src/main.rs"

[[bin]]
name = "kite"
path = "src/bin/kite.rs"

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5"] }
tokio = { version = "1", features = ["full"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
portable-pty = "0.9.0"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
dotenvy = "0.15"
regex = "1"
vt100 = "0.15"
kite-ctx = { path = "crates/kite-ctx" }
cpal = "0.15"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
debug = 0
incremental = true
overflow-checks = false

[profile.dev.package."*"]
opt-level = 2
overflow-checks = false

[profile.release]
opt-level = 2
codegen-units = 64
lto = false
incremental = false
strip = "symbols"
overflow-checks = false

[patch.crates-io]
vt100 = { path = "vendor/vt100" }


