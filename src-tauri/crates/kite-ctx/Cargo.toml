[package]
name = "kite-ctx"
version = "0.2.0"
edition = "2021"
description = "Zero-ML modular context optimization and token-reuse engine for Kite Code"

[dependencies]
hex = "0.4"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
